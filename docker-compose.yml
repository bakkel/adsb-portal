services:
  adsb-portal:
    build: .
    container_name: adsb-portal
    restart: unless-stopped
    # Shares the host's network namespace so the container can reach
    # fr24feed at http://localhost:8754 without extra configuration —
    # fr24feed itself is not containerized (needs direct USB SDR access).
    network_mode: host
    environment:
      - PORT=8081
      - FR24_BASE=http://localhost:8754
    volumes:
      - ./data:/data
